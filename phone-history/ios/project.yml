name: PhoneHistory
options:
  bundleIdPrefix: com.blro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/PhoneHistory.xcconfig
  Release: Config/PhoneHistory.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  PhoneHistory:
    type: application
    platform: iOS
    sources:
      - path: Core
      - path: App
        excludes:
          - Info.plist
          - PhoneHistory.entitlements
          - PrivacyInfo.xcprivacy
    resources:
      - path: App/PrivacyInfo.xcprivacy
      - path: App/Assets.xcassets
    info:
      path: App/Info.plist
    entitlements:
      path: App/PhoneHistory.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHONE_HISTORY_BUNDLE_ID)
        PRODUCT_NAME: 폰 히스토리
        INFOPLIST_KEY_CFBundleDisplayName: 폰 히스토리
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PhoneHistoryShare
    scheme:
      testTargets:
        - PhoneHistoryTests
      gatherCoverageData: true

  PhoneHistoryShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Core/AppPreferences.swift
      - path: Core/CaptureService.swift
      - path: Core/CaptureServices.swift
      - path: Core/KeychainStore.swift
      - path: Core/PhoneEvent.swift
      - path: Core/RuntimeConstants.swift
      - path: Core/SecureEventQueue.swift
      - path: ShareExtension
        excludes:
          - Info.plist
          - PhoneHistoryShare.entitlements
          - PrivacyInfo.xcprivacy
    resources:
      - path: ShareExtension/PrivacyInfo.xcprivacy
    info:
      path: ShareExtension/Info.plist
    entitlements:
      path: ShareExtension/PhoneHistoryShare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHONE_HISTORY_SHARE_BUNDLE_ID)
        PRODUCT_NAME: 폰 히스토리에 저장
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  PhoneHistoryTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: PhoneHistory
    sources:
      - path: Core
      - path: Tests
    dependencies:
      - target: PhoneHistory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHONE_HISTORY_TEST_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
