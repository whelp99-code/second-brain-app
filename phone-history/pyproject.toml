[project]
name = "phone-history"
version = "0.1.0"
description = "Explicit iPhone activity capture and Second Brain review bridge"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45",
]

[project.scripts]
phone-history = "phone_history.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/phone_history"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server", ".."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
