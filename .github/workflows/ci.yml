name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Isolate home and config
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/xdg-config" "$RUNNER_TEMP/xdg-data"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg-data" >> "$GITHUB_ENV"

      - name: Ruff
        run: uv run ruff check sb tests

      - name: basedpyright (files that pass on master)
        run: |
          mapfile -t exclude < .github/pyright-baseline.txt
          declare -A skip
          for path in "${exclude[@]}"; do
            [[ -z "$path" || "$path" == \#* ]] && continue
            skip["$path"]=1
          done
          files=()
          while IFS= read -r path; do
            [[ -n "${skip[$path]:-}" ]] && continue
            files+=("$path")
          done < <(find sb tests -name '*.py' -type f | sort)
          set +e
          uv run basedpyright --outputjson "${files[@]}" > "$RUNNER_TEMP/basedpyright.json"
          set -e
          uv run python - << 'PY'
          import json, os, sys
          from pathlib import Path
          data = json.loads(Path(os.environ["RUNNER_TEMP"], "basedpyright.json").read_text())
          errors = [d for d in data.get("generalDiagnostics", []) if d.get("severity") == "error"]
          print(f"{len(errors)} errors, {data.get('summary', {}).get('warningCount', '?')} warnings")
          for d in errors[:50]:
              loc = d.get("range", {}).get("start", {})
              print(f"{d.get('file')}:{loc.get('line', 0)+1}: {d.get('message','').splitlines()[0]}")
          sys.exit(1 if errors else 0)
          PY

      - name: Pytest
        run: uv run pytest -q --ignore=tests/test_embeddings.py
