[project]
name = "second-brain"
version = "1.0.4"
description = "Second Brain: cited auto-growing personal wiki with contradiction detection"
requires-python = ">=3.12"
authors = [
    { name = "whelp99-code", email = "whelp99@gmail.com" },
]
dependencies = [
    "pyyaml",
    "defusedxml",
    "pypdf",
    "python-docx",
    "openpyxl",
    "llama-index-core==0.14.24",
    "psycopg[binary]",
    "mcp",
    "cryptography",
    "sqlite-vec==0.1.9",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers==6.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "basedpyright",
]

[project.scripts]
sb = "sb.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sb"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
