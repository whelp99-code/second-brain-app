openapi: 3.1.0
info:
  title: Phone History Ingest API
  version: 0.1.0-predevice
servers:
  - url: https://phone-history.example.invalid
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200':
          description: Healthy
  /v1/capabilities:
    get:
      responses:
        '200':
          description: Server capabilities
  /v1/events:batch:
    post:
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./phone-event-v1.schema.json
      responses:
        '200':
          description: Exact replay
        '201':
          description: Accepted
        '400':
          description: Invalid payload
        '401':
          description: Unauthorized
        '409':
          description: Idempotency or event conflict
        '413':
          description: Request too large
  /v1/events:encrypted:
    post:
      description: >-
        AES-GCM application-layer encrypted batch for file-backed iOS background
        uploads. The key is derived from the authenticated API token; TLS remains
        mandatory outside loopback development.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, payload_base64]
              properties:
                version: {const: 1}
                payload_base64: {type: string, minLength: 1}
      responses:
        '200': {description: Exact replay}
        '201': {description: Accepted}
        '400': {description: Invalid or unauthenticated ciphertext}
        '401': {description: Unauthorized}
        '409': {description: Idempotency or event conflict}
        '413': {description: Request too large}
  /v1/timeline:
    get:
      parameters:
        - in: query
          name: device_id
          required: false
          schema: {type: string}
        - in: query
          name: date
          required: false
          schema: {type: string, format: date}
        - in: query
          name: limit
          required: false
          schema: {type: integer, minimum: 1, maximum: 500}
      responses:
        '200':
          description: Decrypted timeline for the authenticated owner
  /v1/sync/status:
    get:
      responses:
        '200':
          description: Event, pending sink, candidate, and tombstone counts
  /v1/candidates:
    get:
      parameters:
        - in: query
          name: state
          required: false
          schema:
            enum: [unreviewed, queued_for_owner_review, dismissed]
      responses:
        '200':
          description: Review candidates
  /v1/candidates/{candidate_id}/decision:
    post:
      parameters:
        - in: path
          name: candidate_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  enum: [queue_for_owner_review, dismiss]
      responses:
        '200':
          description: Candidate state changed without canonical approval
        '404':
          description: Candidate not found
  /v1/events/{event_id}:
    delete:
      parameters:
        - in: path
          name: event_id
          required: true
          schema: {type: string}
        - in: query
          name: reason
          required: false
          schema: {type: string, maxLength: 120}
      responses:
        '200':
          description: Deleted or already absent
  /v1/maintenance:
    post:
      responses:
        '200':
          description: Pending exports retried and expired attachments pruned
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
